services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentops}
      POSTGRES_DB: agentops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentops -d agentops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://agentops:${POSTGRES_PASSWORD:-agentops}@postgres:5432/agentops
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-true}
      # JSON array. Defaults to the frontend's published port; override with
      # BACKEND_CORS_ORIGINS in .env (e.g. when serving from another origin).
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:${FRONTEND_PORT:-8080}"]}
    # ANTHROPIC_API_KEY / JWT_SECRET_KEY / POSTGRES_PASSWORD come from a root
    # .env file (cp .env.example .env) — Docker Compose reads that
    # automatically for ${VAR} substitution above. Never commit that file.
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The image entrypoint runs `alembic upgrade head` before uvicorn while
    # RUN_MIGRATIONS_ON_START is true (the default), so "healthy" still means
    # "schema is up to date" - the frontend's `condition: service_healthy`
    # relies on that. Set it to false to migrate separately (`migrate` below).

  # One-off migrations, same image as the backend. Not started by a plain
  # `docker compose up`; run it with:
  #   docker compose --profile tools run --rm migrate
  migrate:
    build:
      context: ./backend
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql+asyncpg://agentops:${POSTGRES_PASSWORD:-agentops}@postgres:5432/agentops
      RUN_MIGRATIONS_ON_START: "false"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
